{% load static i18n %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'orderpiqrApp/css/queue_picker.css' %}">
    <link rel="icon" type="image/png" href="{% static 'icons/icon-192.png' %}">
    <link rel="apple-touch-icon" href="{% static 'icons/icon-192.png' %}">
    <!-- Self-hosted: a third-party CDN outage must never stop a shift.
         Byte-identical to the pinned version these pages used to fetch. -->
    <script src="{% static 'orderpiqrApp/js/vendor/htmx-1.9.10.min.js' %}"></script>
    <title>{% trans "Pick Queue" %}</title>
</head>
<body>
    <div class="picker-header">
        <div class="header-left">
            <a href="{% url 'index' %}" class="back-link">← {% trans "Scanner" %}</a>
        </div>
        <h1>{% trans "Order Queue" %}</h1>
        <div class="header-right">
            {% if device %}
            <span class="device-name">{{ device.name }}</span>
            {% endif %}
        </div>
    </div>

    <div class="picker-container"
         hx-get="{% url 'queue_picker_partial' %}"
         hx-trigger="every 2s"
         hx-swap="innerHTML">
        {% include 'queue/_picker_orders.html' %}
    </div>

    <div id="notification-container" class="notification-container"></div>

    {% if error %}
    <div class="error-message">{{ error }}</div>
    {% endif %}

    <script>
        {# Strings used inside JS literals below. escapejs at the point of use #}
        {# keeps a quote in a translation from terminating the literal. #}
        {% trans "Claiming..." as msg_claiming %}
        {% trans "Order claimed! Redirecting..." as msg_order_claimed %}
        {% trans "Start Picking" as msg_start_picking %}
        {% trans "Error claiming order" as msg_error_claiming %}
        {% trans "Take Over" as msg_take_over %}
        {% trans "%(name)s has been picking this order for %(duration)s. Take it over? Picks they already recorded are kept." as msg_takeover_named_duration %}
        {% trans "%(name)s is picking this order right now. Take it over? Picks they already recorded are kept." as msg_takeover_named %}
        {% trans "This order is being picked by someone else. Take it over? Picks they already recorded are kept." as msg_takeover_anon %}

        const csrfToken = "{{ csrf_token }}";

        // Get device fingerprint
        function getDeviceFingerprint() {
            const STORAGE_KEY = 'orderpiqr_device_id';
            let deviceId = localStorage.getItem(STORAGE_KEY);
            if (!deviceId) {
                deviceId = (typeof crypto !== 'undefined' && crypto.randomUUID)
                    ? crypto.randomUUID()
                    : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
                        const r = Math.random() * 16 | 0;
                        const v = c === 'x' ? r : (r & 0x3 | 0x8);
                        return v.toString(16);
                    });
                localStorage.setItem(STORAGE_KEY, deviceId);
            }
            return deviceId;
        }

        function claimOrder(orderId, button) {
            console.log('[Queue Picker] claimOrder called with orderId:', orderId);

            try {
                button.disabled = true;
                button.textContent = '{{ msg_claiming|escapejs }}';

                const deviceFingerprint = getDeviceFingerprint();
                console.log('[Queue Picker] Device fingerprint:', deviceFingerprint);

                const url = '{% url "queue_claim_order" order_id=0 %}'.replace('0', orderId);
                console.log('[Queue Picker] Fetch URL:', url);

                fetch(url, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': csrfToken
                    },
                    body: JSON.stringify({
                        deviceFingerprint: deviceFingerprint
                    })
                })
                .then(response => {
                    console.log('[Queue Picker] Response status:', response.status);
                    return response.json();
                })
                .then(data => {
                    console.log('[Queue Picker] Response data:', data);
                    if (data.status === 'ok') {
                        showNotification('{{ msg_order_claimed|escapejs }}', false);

                        // Store the order data for the picking interface
                        const orderData = {
                            order_code: data.order_code,
                            picklist: data.picklist
                        };
                        console.log('[Queue Picker] Storing in sessionStorage:', orderData);
                        sessionStorage.setItem('claimed_order', JSON.stringify(orderData));
                        console.log('[Queue Picker] Verified storage:', sessionStorage.getItem('claimed_order'));

                        setTimeout(() => {
                            // Redirect with order code as URL parameter
                            const redirectUrl = '{% url "index" %}?order=' + encodeURIComponent(data.order_code);
                            console.log('[Queue Picker] Redirecting to:', redirectUrl);
                            window.location.href = redirectUrl;
                        }, 500);
                    } else {
                        console.log('[Queue Picker] Error response:', data.message);
                        showNotification(data.message, true);
                        if (data.redirect_url) {
                            // Device could not be resolved — send the picker to name entry.
                            setTimeout(() => { window.location.href = data.redirect_url; }, 1500);
                            return;
                        }
                        button.disabled = false;
                        button.textContent = '{{ msg_start_picking|escapejs }}';
                    }
                })
                .catch(error => {
                    console.error('[Queue Picker] Fetch error:', error);
                    showNotification('{{ msg_error_claiming|escapejs }}', true);
                    button.disabled = false;
                    button.textContent = '{{ msg_start_picking|escapejs }}';
                });
            } catch (e) {
                console.error('[Queue Picker] Exception in claimOrder:', e);
                showNotification('{{ msg_error_claiming|escapejs }}', true);
            }
        }

        function reclaimOrder(orderId, button, pickedBy, pickedFor) {
            // Name the colleague who gets interrupted: an abstract confirm is
            // clicked through, "take this over from Mariana" is not.
            let message;
            if (pickedBy && pickedFor) {
                message = '{{ msg_takeover_named_duration|escapejs }}'
                    .replace('%(name)s', pickedBy)
                    .replace('%(duration)s', pickedFor);
            } else if (pickedBy) {
                message = '{{ msg_takeover_named|escapejs }}'
                    .replace('%(name)s', pickedBy);
            } else {
                message = '{{ msg_takeover_anon|escapejs }}';
            }
            if (!confirm(message)) {
                return;
            }
            button.disabled = true;
            button.textContent = '{{ msg_claiming|escapejs }}';

            const deviceFingerprint = getDeviceFingerprint();
            const url = '{% url "queue_claim_order" order_id=0 %}'.replace('0', orderId);

            fetch(url, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': csrfToken
                },
                body: JSON.stringify({
                    deviceFingerprint: deviceFingerprint,
                    force: true
                })
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'ok') {
                    showNotification(data.message, false);
                    setTimeout(() => {
                        window.location.href = '{% url "index" %}?order=' + encodeURIComponent(data.order_code);
                    }, 500);
                } else {
                    showNotification(data.message, true);
                    button.disabled = false;
                    button.textContent = '{{ msg_take_over|escapejs }}';
                }
            })
            .catch(error => {
                showNotification('{{ msg_error_claiming|escapejs }}', true);
                button.disabled = false;
                button.textContent = '{{ msg_take_over|escapejs }}';
            });
        }

        function showNotification(message, isError) {
            const container = document.getElementById('notification-container');
            const notification = document.createElement('div');
            notification.className = 'notification' + (isError ? ' error' : '');
            notification.textContent = message;
            container.appendChild(notification);

            setTimeout(() => notification.classList.add('show'), 10);
            setTimeout(() => {
                notification.classList.remove('show');
                setTimeout(() => notification.remove(), 500);
            }, 3000);
        }
    </script>
</body>
</html>
